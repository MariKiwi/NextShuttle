# Two isolated listener processes using the same image and persistent data.
# Bind backend ports to the NPM host gateway, never all interfaces.
# These are backend HTTP sockets; clients must reach them ONLY through HTTPS.
services:
  shuttle-public:
    build: .
    image: nextshuttle:development
    command: ["--mode", "public", "--bind", "0.0.0.0", "--port", "8080"]
    ports: ["${NEXTSHUTTLE_BIND_IP:-172.19.0.1}:9080:8080"]
    environment: &environment
      NEXTSHUTTLE_PUBLIC_URL: https://helios-public.tail43e437.ts.net/nextshuttle/
      NEXTSHUTTLE_DATA: /data
      NEXTSHUTTLE_SERVICE_TOKEN_FILE: /run/secrets/service_token
      NEXTSHUTTLE_CAPACITY: "1073741824"
      NEXTSHUTTLE_MAX_BLOB: "35651584"
      NEXTSHUTTLE_TRUSTED_PROXIES: "${NEXTSHUTTLE_TRUSTED_PROXIES:-}"
      NEXTSHUTTLE_GEOIP_DATABASE: /geoip/country.mmdb
      NEXTSHUTTLE_PROXY_TOKEN_FILE: /proxy/forwarded_token
    volumes: ["shuttle-data:/data", "./geoip:/geoip:ro", "./proxy:/proxy:ro"]
    networks: [backend]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    ulimits:
      nofile: {soft: 256, hard: 256}
  shuttle-private:
    image: nextshuttle:development
    build: .
    command: ["--mode", "private", "--bind", "0.0.0.0", "--port", "8081"]
    ports: ["${NEXTSHUTTLE_BIND_IP:-172.19.0.1}:9081:8081"]
    environment: *environment
    volumes: ["shuttle-data:/data"]
    secrets: [service_token, admin_password]
    networks: [backend]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    ulimits:
      nofile: {soft: 256, hard: 256}
  shuttle-ingestion:
    build: {context: ., dockerfile: Dockerfile.ingestion}
    image: nextshuttle-ingestion:development
    secrets: [scanner_token]
    volumes: ["clam-socket:/run/nextshuttle", "lmd-sigs:/usr/local/maldetect/sigs:ro"]
    tmpfs:
      - /quarantine:size=256m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
      - /tmp:size=128m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
      - /usr/local/maldetect/pub/shuttle:size=128m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev
    networks: [scanner-backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
  shuttle-scanner-gateway:
    image: nginx:stable-alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "10001:10001"
    depends_on: [shuttle-ingestion]
    ports: ["${NEXTSHUTTLE_BIND_IP:-172.19.0.1}:9082:8082"]
    volumes: ["./ingestion/gateway.conf:/etc/nginx/nginx.conf:ro"]
    tmpfs: ["/tmp:size=64m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev"]
    networks: [backend, scanner-backend]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
  shuttle-clamd:
    image: nextshuttle-ingestion:development
    build: {context: ., dockerfile: Dockerfile.ingestion}
    command: ["clamd", "--config-file=/etc/nextshuttle/clamd.conf", "--foreground=true"]
    volumes: ["clam-socket:/run/nextshuttle", "clam-definitions:/var/lib/clamav:ro"]
    tmpfs: ["/tmp:size=256m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev"]
    networks: [scanner-backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    pids_limit: 64
    cpus: 1
    restart: unless-stopped
  shuttle-signatures:
    image: nextshuttle-ingestion:development
    build: {context: ., dockerfile: Dockerfile.ingestion}
    command: ["python3", "-m", "ingestion.update"]
    volumes: ["clam-definitions:/var/lib/clamav", "clam-socket:/run/nextshuttle", "lmd-sigs:/usr/local/maldetect/sigs", "lmd-clean:/usr/local/maldetect/clean"]
    tmpfs: ["/tmp:size=128m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev", "/usr/local/maldetect/pub/shuttle:size=128m,uid=10001,gid=10001,mode=0700,noexec,nosuid,nodev"]
    read_only: true
    networks: [backend]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 64
    cpus: 0.5
    restart: unless-stopped
volumes:
  shuttle-data:
  clam-socket:
  clam-definitions:
  lmd-sigs:
  lmd-clean:
networks:
  backend:
  scanner-backend:
    internal: true
secrets:
  service_token:
    file: ./secrets/service_token
  admin_password:
    file: ./secrets/admin_password
  scanner_token:
    file: ./secrets/scanner_token
