name: Relay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker build -t nextshuttle:test .
  nextcloud-app-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: find nextcloud -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/test_event_catalog.php
      - run: tar -czf nextshuttle-notifications-0.1.0.tar.gz -C nextcloud nextshuttle
      - uses: actions/upload-artifact@v4
        with:
          name: nextshuttle-notifications-development
          path: nextshuttle-notifications-0.1.0.tar.gz
