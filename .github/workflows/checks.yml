name: Relay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ingestion/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker build -t nextshuttle:test .
  nextcloud-app-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: sodium, mbstring
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: find nextcloud -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/test_event_catalog.php
      - run: node tests/crypto-interop.mjs write /tmp/crypto-interop
      - run: php tests/test_crypto_interop.php /tmp/crypto-interop
      - run: node tests/crypto-interop.mjs verify /tmp/crypto-interop
      - run: tar -czf nextshuttle-0.3.0.tar.gz -C nextcloud nextshuttle
      - uses: actions/upload-artifact@v4
        with:
          name: nextshuttle-development
          path: nextshuttle-0.3.0.tar.gz
